name: v3.4 shadow backtest
on:
  workflow_dispatch:
    inputs:
      cutoff:
        description: "Cutoff date YYYY-MM-DD"
        required: true
        default: "2023-10-15"
      future_days:
        description: "Future window days"
        required: true
        default: "180"
jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: cache/binance_public
          key: binance-public-v34-${{ runner.os }}-${{ inputs.cutoff }}-${{ hashFiles('universe_100.txt') }}
          restore-keys: |
            binance-public-v34-${{ runner.os }}-
            binance-public-${{ runner.os }}-
      - run: pip install -r requirements.txt
      - name: Run v3.4 shadow backtest
        run: python backtest_v34_shadow.py --cutoff "${{ inputs.cutoff }}" --symbols universe_100.txt --future-days "${{ inputs.future_days }}" --outdir results_v34
      - uses: actions/upload-artifact@v4
        with:
          name: v34-shadow-${{ inputs.cutoff }}
          path: results_v34/
          retention-days: 30
